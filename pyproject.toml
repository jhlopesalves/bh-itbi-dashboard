[project]
name = "bh-itbi-dashboard"
version = "0.1.0"
description = "Painel analítico do mercado residencial de Belo Horizonte a partir dos registros do ITBI, em Dash e Plotly"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "dash>=4.5.0",
    "gunicorn>=27.0.1",
    "h3>=4.5.0",
    "huggingface-hub>=2.4.0",
    "numpy>=2.5.5",
    "pandas>=3.1.1",
    "plotly>=7.1.0",
    "pyarrow>=26.0.1",
    "scikit-learn>=1.9.1",
    "statsmodels>=0.15.0",
    "threadpoolctl>=3.6.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "pandas-stubs>=3.0.0.260204",
    "pyright>=1.1.408",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 96
target-version = "py314"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ANN", "C90", "PL", "PERF", "RET", "PIE"]
ignore = [
    # Intentional Portuguese typography (en-dash –, minus −, guillemets «») in strings.
    "RUF001",
    # Intentional Portuguese typography in docstrings.
    "RUF002",
    # Intentional Portuguese typography in comments.
    "RUF003",
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.ruff.lint.per-file-ignores]
# Test assertions compare explicit domain values; pytest fixtures use dynamic injection.
"tests/*" = ["PLR2004", "ANN"]

[tool.pyright]
typeCheckingMode = "standard"
pythonVersion = "3.14"
include = ["bh_itbi", "main.py", "wsgi.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
